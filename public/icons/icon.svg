<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.55"/>
    </filter>
  </defs>
  
  <!-- Fundo com cantos arredondados padrão de App (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Ícone Central: Livro Aberto com Ondas Sonoras Neurais -->
  <g filter="url(#glow)" transform="translate(64, 76)">
    <!-- Páginas do Livro -->
    <path d="M40 80 C 110 50, 180 80, 192 100 C 204 80, 274 50, 344 80 L 344 290 C 274 260, 204 290, 192 305 C 180 290, 110 260, 40 290 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Linha Central da Lombada -->
    <line x1="192" y1="100" x2="192" y2="305" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Ondas Sonoras Emergindo do Livro -->
    <!-- Barra Central de Áudio -->
    <line x1="192" y1="36" x2="192" y2="68" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>
    <!-- Barras Médias -->
    <line x1="152" y1="46" x2="152" y2="68" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <line x1="232" y1="46" x2="232" y2="68" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
    <!-- Barras Menores -->
    <line x1="116" y1="56" x2="116" y2="68" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>
    <line x1="268" y1="56" x2="268" y2="68" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
